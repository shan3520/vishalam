# Mid-size check of loss curve / LR before committing weeks to 350M. Also the first agent model.
name: vishalam-125m
model:
  vocab_size: 50304
  d_model: 768
  n_layers: 12
  n_heads: 12
  ffn_dim: 2048
  max_seq_len: 4096
train:
  seq_len: 4096
  micro_batch: 2
  global_batch_seqs: 128  # 524k tokens per step
  total_tokens: 2_500_000_000
  lr: 6.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 500
  weight_decay: 0.1
  grad_clip: 1.0
  z_loss: 1.0e-4
  grad_checkpointing: true
  eval_every: 250
  eval_batches: 20
  save_every_minutes: 30
