# M1 agent fine-tuning of the 350M main model.
name: vishalam-350m-agent-m1
init: hub:vishalam-350m/final/model.pt
train:
  seq_len: 4096
  micro_batch: 2
  global_batch_seqs: 32     # 131k tokens per step
  epochs: 1                 # 3 epochs memorised the 85 task families: 93% seen vs 3% unseen (125M)
  mix_fraction: 0.2         # 20% of each step is pretraining text (keeps general code knowledge)
  lr: 5.0e-5
  min_lr_ratio: 0.1
  warmup_steps: 100
  weight_decay: 0.0
  grad_clip: 1.0
  z_loss: 0.0
  grad_checkpointing: true
  eval_every: 200
  save_every_minutes: 30
