# Main model: ~360M params, 10B tokens, 4096 context from the start.
name: vishalam-350m
model:
  vocab_size: 50304
  d_model: 1024
  n_layers: 24
  n_heads: 16
  ffn_dim: 2816
  max_seq_len: 4096
train:
  seq_len: 4096
  micro_batch: 2
  global_batch_seqs: 128  # 524k tokens per step -> ~19k steps
  total_tokens: 10_000_000_000
  lr: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 1000
  weight_decay: 0.1
  grad_clip: 1.0
  z_loss: 1.0e-4
  grad_checkpointing: true
  compile: true            # torch.compile on CUDA; falls back to eager automatically
  eval_every: 500
  eval_batches: 20
  save_every_minutes: 45
